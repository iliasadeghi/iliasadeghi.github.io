  <path class="c-hair s-hair" stroke-width="3" stroke-linejoin="round" d="M68 92 C67 88 68 86 69 84 C71 76 74 70 78 64 C82 52 98 40 122 38 C146 36 164 50 163 64 C167 70 170 78 171 86 L171 92 L168 92 C167 88 165 84 162 80 L156 70 L150 74 L144 64 L136 72 L128 62 L120 70 L112 63 L104 72 L96 66 L88 74 L80 80 C75 84 72 88 72 92 Z"/>
  <path class="c-hair-hi" d="M102 50 C110 42 126 40 144 43 C128 46 114 50 104 58 Z"/>
