    <circle cx="101" cy="108" r="5.5" fill="#1c1917"/>
    <circle cx="139" cy="108" r="5.5" fill="#1c1917"/>
    <circle cx="103" cy="106" r="1.8" fill="#fff"/>
    <circle cx="141" cy="106" r="1.8" fill="#fff"/>
  </g>
  <path d="M120 112 Q115 124 122 126" fill="none" stroke="#000" stroke-opacity=".2" stroke-width="3" stroke-linecap="round"/>
  <circle cx="88" cy="126" r="8" fill="#f43f5e" opacity=".18"/>
  <circle cx="152" cy="126" r="8" fill="#f43f5e" opacity=".18"/>
