<svg xmlns="http://www.w3.org/2000/svg" width="480" height="520" viewBox="0 0 240 260" role="img" aria-label="Illustration of a smiling boy in a hoodie">
  <!-- TODO: customise the colours with the skin, hair and shirt CSS variables, or replace with your own photo -->
  <style>
    .c-skin { fill: var(--skin, #f7d6bd); }
    .c-skin-shade { fill: var(--skin-shade, #e8b999); }
    .c-hair { fill: var(--hair, #1f1714); }
    .c-hair-hi { fill: var(--hair-hi, #3a2a24); }
    .c-shirt { fill: var(--shirt, #4f46e5); }
    .c-shirt-dark { fill: var(--shirt-dark, #3730a3); }
    .s-shirt-dark { stroke: var(--shirt-dark, #3730a3); }
    .s-hair { stroke: var(--hair, #1f1714); }
    .s-glasses { stroke: var(--glasses, #262626); }
  </style>
  <path class="c-shirt" d="M16 260 C16 206 56 190 120 190 C184 190 224 206 224 260 Z"/>
  <path class="c-shirt-dark" d="M66 200 C70 176 90 166 120 166 C150 166 170 176 174 200 Z"/>
  <rect class="c-skin-shade" x="102" y="146" width="36" height="62" rx="14"/>
  <ellipse cx="120" cy="160" rx="30" ry="12" fill="#000" opacity=".12"/>
  <path class="s-shirt-dark" d="M88 192 C100 218 140 218 152 192" fill="none" stroke-width="10" stroke-linecap="round"/>
  <path d="M106 214 L104 242 M134 214 L136 242" stroke="#fff" stroke-opacity=".85" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="104" cy="245" r="3.5" fill="#fff" fill-opacity=".85"/>
  <circle cx="136" cy="245" r="3.5" fill="#fff" fill-opacity=".85"/>
  <circle class="c-skin" cx="70" cy="110" r="10"/>
  <circle class="c-skin" cx="170" cy="110" r="10"/>
  <circle class="c-skin-shade" cx="70" cy="111" r="4.5"/>
